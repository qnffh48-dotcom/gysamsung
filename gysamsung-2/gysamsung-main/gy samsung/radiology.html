<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>방과</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="radiology.css">
</head>

<body>


    <div class="sidebar">

    <div class="logo">
    <img src="logo.png" alt="가양삼성정형외과">
</div>
        <div class="nav">
            <button onclick="location.href='index.html'">
    <span class="gold-dot"></span>
    홈
    <img src="house.png" class="nav-img-icon">
</button>
            <button onclick="location.href='schedule.html'">
        <span class="gold-dot"></span>
        스케줄
           <img src="calendar-check.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='stats.html'">
        <span class="gold-dot"></span>
        통계
        <img src="chart-column-increasing.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='closing.html'">
        <span class="gold-dot"></span>
        마감일지
        <img src="notebook-pen.png" class="nav-img-icon">
    </button>
            
        </div>
    </div>

    <main class="radiology-main">

    <div class="radiology-layout">

        <!-- 탭 버튼 -->
        <div class="tab-buttons">

            <button class="tab-btn active"
                    data-tab="closing">
                마감일지
            </button>

            <button class="tab-btn"
                    data-tab="temp1">
                X-ray스케줄
            </button>

            <button class="tab-btn"
                    data-tab="temp2">
                임시2
            </button>

            <button class="tab-btn"
                    data-tab="temp3">
                임시3
            </button>

        </div>

        <!-- 큰 흰박스 -->
        <div class="tab-content">

            <!-- 마감일지 -->
            <div class="tab-page active"
                 id="closing">
                 <div class="radiology-date-bar">
    <button class="date-move-btn" id="prevDayBtn">◀</button>

    <div class="date-select-box">
        <select id="yearSelect"></select>
        <select id="monthSelect"></select>
        <select id="daySelect"></select>
    </div>

    <button class="date-move-btn" id="nextDayBtn">▶</button>
</div>

                <table class="closing-table radiology-table">
                    <tr>
                        <th colspan="2" class="main-title">
                            영상의학과 마감일지
                        </th>
                    </tr>

                    <tr>
                        <th colspan="2" class="sub-title">
                            C-arm
                        </th>
                    </tr>

                    <tr>
                        <th>구분</th>
                        <th>건수</th>
                    </tr>

                    <tr>
                        <td>정형외과1(정)</td>
                        <td>
                            <input class="report-input carm-count"
                                   data-key="carm_os1"
                                   value="">
                        </td>
                    </tr>

                    <tr>
                        <td>신경과(노)</td>
                        <td>
                            <input class="report-input carm-count"
                                   data-key="carm_neuro"
                                   value="">
                        </td>
                    </tr>

                    <tr>
                        <td>정형외과3(욱)</td>
                        <td>
                            <input class="report-input carm-count"
                                   data-key="carm_os3"
                                   value="">
                        </td>
                    </tr>

                    <tr>
                        <td>정형외과4(채)</td>
                        <td>
                            <input class="report-input carm-count"
                                   data-key="carm_os4"
                                   value="">
                        </td>
                    </tr>

                    <tr>
                        <td>정형외과5(남)</td>
                        <td>
                            <input class="report-input carm-count"
                                   data-key="carm_os5"
                                   value="">
                        </td>
                    </tr>

                    <tr class="total">
                        <td>총합</td>
                        <td>
                            <input class="report-input total-input"
                                   data-key="carm_total"
                                   value="0개"
                                   readonly>
                        </td>
                    </tr>

                    <tr>
                        <th colspan="2" class="sub-title">
                            기타(관절조영)
                        </th>
                    </tr>

                    <tr>
                        <th>구분</th>
                        <th>건수</th>
                    </tr>

                    <tr>
                        <td>관절조영</td>
                        <td>
                            <input class="report-input"
                                   data-key="arthrogram"
                                   value="">
                        </td>
                    </tr>

                </table>

            </div>

            <!-- 임시1 -->
<div class="tab-page" id="temp1">

    <div class="xray-wrap">

        <div class="xray-month-box">
            <button type="button" onclick="changeXrayMonth(-1)">◀</button>
            <span id="xrayTitle"></span>
            <button type="button" onclick="changeXrayMonth(1)">▶</button>
        </div>

        <table class="xray-calendar">
            <thead>
                <tr>
                    <th></th>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                    <th class="sat">토</th>
                </tr>
            </thead>
            <tbody id="xrayBody"></tbody>
        </table>

    </div>

</div>


            <!-- 임시2 -->
            <div class="tab-page"
                 id="temp2">

                <h1>임시2</h1>

            </div>

            <!-- 임시3 -->
            <div class="tab-page"
                 id="temp3">

                <h1>임시3</h1>

            </div>

               </div>
    </div>
</main>

<script src="radiology-tabs.js"></script>
<script type="module" src="radiology.js"></script>
<script type="module" src="role-check.js"></script>
<script type="module" src="logout-on-close.js"></script>
</body>
</html>
