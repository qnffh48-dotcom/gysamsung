<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가양삼성정형외과</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
      <div class="sidebar">

    <div class="logo hospital-logo-menu">
    <img src="logo.png" alt="가양삼성정형외과">

    <div class="hospital-dropdown">
        <button onclick="selectHospital('gayang')">
            가양 삼성정형외과
        </button>

        <button onclick="selectHospital('banghak')">
            방학 삼성정형외과
        </button>
         <button onclick="selectHospital('bundang')">
            분당 삼성정형외과
        </button>
    </div>
</div>

        <div class="nav">

    <button onclick="location.href='schedule.html'">
        <span class="gold-dot"></span>
        스케줄
           <img src="calendar-check.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='stats.html'">
        <span class="gold-dot"></span>
        통계
        <img src="chart-column-increasing.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='closing.html'">
        <span class="gold-dot"></span>
        마감일지
        <img src="notebook-pen.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='radiology.html'">
        <span class="gold-dot"></span>
        방사선과
        <img src="radiation.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='nurse.html'">
        <span class="gold-dot"></span>
        간호과
        <img src="syringe.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='desk.html'">
        <span class="gold-dot"></span>
        원무과
        <img src="banknote.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='therapy.html'">
        <span class="gold-dot"></span>
        물리치료과
        <img src="biceps-flexed.png" class="nav-img-icon">
    </button>

<button onclick="location.href='purchase.html'">
    <span class="gold-dot"></span>
    물품 구매 신청
    <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/cart.svg" class="nav-img-icon">
</button>

    <button class="logout-btn" id="logoutBtn">
         <span class="gold-dot"></span>
   </span> 로그아웃
   <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/box-arrow-right.svg"
         class="nav-img-icon">
</button>

    <div class="sidebar-clock">

    <div id="clockDate"></div>

    <div id="clockTime"></div>

</div>

</div>
    </div>

   <main class="main">

    <div class="notice-url-row">

        <section class="notice-card">

            <div class="notice-header">
                <h1>[필독] 공지사항 📢</h1>

               <button class="notice-add-btn" id="noticeEditBtn" onclick="addNotice()">공지 추가</button>
            </div>

            <div class="notice-list" id="noticeList"></div>

        </section>

        <section class="url-board">

            <h3>📌 URL 모음</h3>

            <div class="url-input-box">
                <input type="text" id="urlName" placeholder="사이트 이름">
                <input type="text" id="urlLink" placeholder="주소 입력">
                <button type="button" onclick="addUrl()">추가</button>
            </div>

            <div id="urlList"></div>

        </section>

    </div>

    <section class="today-card">

        <h2>TODAY OFF💤</h2>

        <div class="today-list">

            <div>
                <strong>의사</strong>
                <span class="today-doctor"> </span>
            </div>

            <div>
                <strong>방과</strong>
                <span class="today-room"> </span>
            </div>

            <div>
                <strong>간호</strong>
                <span class="today-nurse"> </span>
            </div>

            <div>
                <strong>원무</strong>
                <span class="today-desk"> </span>
            </div>

            <div>
                <strong>물치</strong>
                <span class="today-therapy"> </span>
            </div>

        </div>

    </section>


<div class="manual-section">

    <div class="manual-header">
        업무 매뉴얼 📂
        <button class="manual-add-btn" onclick="addManualCard()">매뉴얼 추가</button>
    </div>

    <div class="manual-grid" id="manualGrid"></div>

</div>

<div class="manual-modal" id="manualModal">
    <div class="manual-modal-box">

        <button class="modal-close" onclick="closeModal()">✕</button>

        <h2 id="modalTitle"></h2>

        <textarea id="modalContent" spellcheck="false"></textarea>

    </div>
</div>

</main>

<script type="module" src="script.js?v=999"></script>
<script type="module" src="role-check.js"></script>
<script type="module" src="logout.js"></script>
</body>
</html>
