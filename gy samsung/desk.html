<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>원무</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="desk.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <img src="logo.png" alt="가양삼성정형외과">
    </div>

    <div class="nav">
        <button onclick="location.href='index.html'">
    <span class="gold-dot"></span>
    홈
    <img src="house.png" class="nav-img-icon">
</button>
            <button onclick="location.href='schedule.html'">
        <span class="gold-dot"></span>
        스케줄
           <img src="calendar-check.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='stats.html'">
        <span class="gold-dot"></span>
        통계
        <img src="chart-column-increasing.png" class="nav-img-icon">
    </button>

    <button onclick="location.href='closing.html'">
        <span class="gold-dot"></span>
        마감일지
        <img src="notebook-pen.png" class="nav-img-icon">
    </button>

    
    </div>
    
</div>

<main class="desk-main">

    
<div class="excel-upload-buttons">

    <button class="excel-btn"
            onclick="document.getElementById('dailyExcelInput').click()">
        일일 환자 집계
    </button>

    <button class="excel-btn"
            onclick="document.getElementById('routeExcelInput').click()">
        내원경로
    </button>

    

    <input
        type="file"
        id="dailyExcelInput"
        accept=".xlsx,.xls"
        hidden
    >

    <input
        type="file"
        id="routeExcelInput"
        accept=".xlsx,.xls"
        hidden
    >

</div>


    <div class="desk-top-tabs">
        
    <button class="desk-top-tab active" data-tab="desk-main-page">마감일지</button>
    <button class="desk-top-tab" data-tab="desk-temp1">임시1</button>
    <button class="desk-top-tab" data-tab="desk-temp2">임시2</button>
    <button class="desk-top-tab" data-tab="desk-temp3">임시3</button>
</div>


<div class="desk-top-page active" id="desk-main-page">

    <div class="desk-date-bar">
        <button class="desk-date-btn" id="prevDay">◀</button>

        <div class="desk-date-box">
            <select id="deskYear"></select>
            <select id="deskMonth"></select>
            <select id="deskDay"></select>
        </div>

        <button class="desk-date-btn" id="nextDay">▶</button>
    </div>

    <h1 class="desk-title">원무과 마감일지</h1>

    <section class="desk-section">
        <h2><span class="big-dot"></span>수납 정보 입력</h2>

        

        <div class="desk-card">
            <div id="room1" class="room-page active"></div>
            <div id="room2" class="room-page"></div>
            <div id="room3" class="room-page"></div>
            <div id="room4" class="room-page"></div>
            <div id="room5" class="room-page"></div>
        </div>
    </section>

    <section class="desk-section">
        <h2><span class="big-dot"></span>예약환자 내원 정보 입력</h2>

        <div class="desk-card">
            <table class="desk-table">
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>예약</th>
                        <th>변경</th>
                        <th>취소</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>주사</td>
                        <td><input></td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                    <tr>
                        <td>경과</td>
                        <td><input></td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                   
                </tbody>
            </table>
        </div>
    </section>

    <section class="desk-section">
        <h2><span class="big-dot"></span>주사 환자 예약 현황</h2>

        <div class="desk-card">
            <table class="desk-table">
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>초진 X block</th>
                        <th>재진 X block</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>X</td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                    <tr>
                        <td>주사경과만</td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                    <tr>
                        <td>주사만</td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                    <tr>
                        <td>주사경과+주사</td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                    <tr>
                        <td>이외예약O</td>
                        <td><input></td>
                        <td><input></td>
                    </tr>
                   
                </tbody>
            </table>
        </div>
    </section>
<section class="desk-section">
    <h2><span class="big-dot"></span> 유형별 내원</h2>

    <div class="desk-card">
        <table class="desk-table insurance-table" id="insuranceTypeTable">
            <thead>
                <tr>
                    <th>국민건강보험</th>
                    <th>보호1·2종</th>
                    <th>자보-청구분</th>
                    <th>일반</th>
                    <th>국민건강보험(차상위1종)</th>
                    <th>국민건강보험(차상위2종)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                    <td>0</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
    <section class="desk-section">
    <h2><span class="big-dot"></span>시간대별 내원 현황</h2>

    <div class="desk-card">
        <div class="time-summary-box">
            <div>오전<br><strong id="morningCount">0명</strong></div>
            <div>오후<br><strong id="afternoonCount">0명</strong></div>
            <div>저녁<br><strong id="eveningCount">0명</strong></div>
        </div>

        <canvas id="timePeriodChart"></canvas>
    </div>
</section>
<section class="desk-section">
    <h2><span class="big-dot"></span>내원 경로·매출</h2>

    <div class="desk-card">
        <table class="desk-table" id="routeSalesTable">
            <thead>
                <tr>
                    <th>구분</th>
                    <th>당일</th>
                    <th>매출</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>
    <section class="desk-section">
        <h2><span class="big-dot"></span>특이사항 입력</h2>

        <div class="desk-card">
            <textarea class="memo-box"></textarea>
        </div>
    </section>
</div>

<div class="desk-top-page" id="desk-temp1">
    <div class="desk-card" style="min-height:500px;"></div>
</div>

<div class="desk-top-page" id="desk-temp2">
    <div class="desk-card" style="min-height:500px;"></div>
</div>

<div class="desk-top-page" id="desk-temp3">
    <div class="desk-card" style="min-height:500px;"></div>
</div>



</main>

<script type="module" src="desk.js"></script>
<script type="module" src="role-check.js"></script>
</body>
</html>
