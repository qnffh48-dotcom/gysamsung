        </section>

        <section class="url-board">

            <h3>📌 URL 모음</h3>

                <input type="text" id="urlName" placeholder="사이트 이름">
                <input type="text" id="urlLink" placeholder="주소 입력">
                <button type="button" onclick="addUrl()">추가</button>
            </div>

        </section>

    </div>

    <section class="today-card">
