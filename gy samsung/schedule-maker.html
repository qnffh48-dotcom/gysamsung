<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스케줄 생성 | 가양삼성정형외과</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="schedule-maker.css">
</head>
<body>

<div class="sidebar">
    <div class="logo">
        <img id="hospitalLogo" src="logo.png" alt="병원 로고">
    </div>

    <div class="nav">
        <button onclick="location.href='index.html'">
            <span class="gold-dot"></span>
            홈
            <img src="house.png" class="nav-img-icon" alt="">
        </button>
        <button onclick="location.href='schedule.html'">
            <span class="gold-dot"></span>
            스케줄
            <img src="calendar-check.png" class="nav-img-icon" alt="">
        </button>
       
        
    </div>
</div>

<main class="main schedule-maker-page">
    <div class="page-header">
        <div>
            <p class="eyebrow" id="hospitalName">가양삼성정형외과</p>
            <h1>스케줄 생성</h1>
            <p class="page-desc">요일별 최소/최대 인원, 고정멤버, 휴가, want 휴무를 반영해서 근무표를 생성합니다.</p>
        </div>

        <div class="header-actions">
            <button class="sub-btn" onclick="location.href='schedule.html'">스케줄로 이동</button>
            <button class="primary-btn" onclick="saveCurrentScheduleToCloud(false)">저장</button>
        </div>
    </div>

    <section class="department-tabs-wrap">
        <div class="department-tabs" role="tablist" aria-label="과 선택">
            <button type="button" class="department-tab active" data-dept="radiology" onclick="changeScheduleDepartment('radiology')">방사선과</button>
            <button type="button" class="department-tab" data-dept="nurse" onclick="changeScheduleDepartment('nurse')">간호과</button>
            <button type="button" class="department-tab" data-dept="desk" onclick="changeScheduleDepartment('desk')">원무과</button>
            <button type="button" class="department-tab" data-dept="therapy" onclick="changeScheduleDepartment('therapy')">물리치료과</button>
        </div>
        <div class="active-department-label">
            현재 선택: <strong id="activeDepartmentName">방사선과</strong>
        </div>
    </section>

    <section class="maker-card">
        <div class="card-title-row">
            <h2>기본 설정</h2>
            <span class="save-status" id="saveStatus"></span>
        </div>

        <div class="top-grid">
            <label>
    년도
    <select id="yearInput" onchange="handleMakerMonthChange()"></select>
</label>

<label>
    월
    <select id="monthInput" onchange="handleMakerMonthChange()"></select>
</label>

            <label class="hidden-department-select">
                과
                <select id="departmentSelect" onchange="syncDepartmentTabs()">
                    <option value="radiology">방사선과</option>
                    <option value="nurse">간호과</option>
                    <option value="desk">원무과</option>
                    <option value="therapy">물리치료과</option>
                </select>
            </label>

            <label>
                근무자 수
                <select id="employeeCount" onchange="handleEmployeeCountChange()">
                    <option value="2" selected>2명</option>
                    <option value="3">3명</option>
                    <option value="4">4명</option>
                    <option value="5">5명</option>
                    <option value="6">6명</option>
                    <option value="7">7명</option>
                    <option value="8">8명</option>
                    <option value="9">9명</option>
                    <option value="10">10명</option>
                </select>
            </label>
        </div>

        <h3>근무자 이름</h3>
        <div id="employeeInputs" class="employee-grid"></div>
    </section>

    <section class="maker-card">
        <h2>요일별 조건 설정</h2>
        <div id="daySettings"></div>
    </section>

    <section class="maker-card">
        <h2>want 휴무 선택</h2>
        <p class="hint">직원별로 한 달에 하루만 쉬고 싶은 날을 선택합니다. want는 주 2회 휴무에 포함됩니다.</p>
        <div id="wantSettings"></div>
    </section>

    <section class="maker-card">
        <h2>휴가 날짜 선택</h2>
        <p class="hint">직원별로 쉬어야 하는 날짜를 선택하면 해당 날짜에는 근무자에서 제외됩니다.</p>
        <div id="vacationSettings"></div>
    </section>

    <div class="button-row sticky-actions">
        <button class="primary-btn" onclick="generateSchedule()">스케줄 생성</button>
        <button class="sub-btn" onclick="saveCurrentScheduleToCloud(false)">저장</button>
        <button class="sub-btn" onclick="loadSavedScheduleFromCloud()">불러오기</button>
        <button class="sub-btn" onclick="confirmMonthBalance()">이번달 확정</button>
        <button class="danger-btn" onclick="resetBalanceData()">보정 초기화</button>
    </div>

    <section class="maker-card result-card">
        <h2>생성 결과</h2>

        <div class="calendar-wrap">
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th class="sun">일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                        <th class="sat">토</th>
                    </tr>
                </thead>
                <tbody id="calendarBody"></tbody>
            </table>
        </div>

        <div id="summaryBox"></div>
    </section>
</main>

<script type="module" src="auth-check.js"></script>
<script type="module" src="role-check.js"></script>
<script type="module" src="schedule-maker.js"></script>
</body>
</html>
